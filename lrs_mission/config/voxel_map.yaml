voxel_map:
  ros__parameters:
    # Empty -> the launch file passes the map installed with this package.
    # map_file: /abs/path/to/map.pcd
    frame_id: map

    # Voxel edge length [m]. 0.1 m resolves the 0.35 m drone and the gaps
    # between obstacles; the grid is ~1.6 M voxels, which A* handles easily.
    resolution: 0.1
    padding: 0.0

    # Safety radius [m] = drone radius + controller tolerance + margin:
    #   0.25 (half-diagonal of the 0.347 x 0.347 m collision box)
    # + 0.15 (hard-waypoint position tolerance)
    # + 0.10 (margin for overshoot / voxel discretisation)
    # = 0.50
    inflation_radius: 0.5

    # The shelving racks are solid in Gazebo but the point cloud only samples
    # their surfaces, leaving free-looking gaps between shelf levels. They are
    # filled as solid boxes: the bounding box of all collision elements of
    # models/fei_lrs_racks/model.sdf, per rack row, from the floor up to the
    # top of the tallest element (4.1 m).
    # 6 numbers per box: xmin ymin zmin xmax ymax zmax (map frame, m)
    fill_boxes: [
      1.07,  6.29, 0.0, 7.57,  7.35, 4.10,   # rack row near y = 6.8
      1.07, 10.83, 0.0, 7.57, 11.89, 4.10,   # rack row near y = 11.4
    ]

    # Answered once at startup: x y z triples.
    query_points: [
      13.00, 7.00, 1.00,   # drone spawn / takeoff point
       4.00, 6.80, 1.50,   # between shelf levels of the first rack -> must be occupied
       4.00, 9.00, 1.50,   # aisle between the rack rows
       8.65, 2.02, 1.00,
       4.84, 5.37, 2.00,
       2.08, 9.74, 1.75,
       8.84, 6.90, 2.00,
       2.81, 8.15, 1.50,
      13.60, 1.50, 2.00,
    ]
